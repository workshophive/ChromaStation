- type: entity
  id: PartDigikith
  parent: BaseItem
  name: "digikith body part"
  abstract: true
  components:
    - type: Sprite
      netsync: false
      sprite: _Chroma/Mobs/Species/Digikith/parts.rsi
    - type: Icon
      sprite: _Chroma/Mobs/Species/Digikith/parts.rsi
    - type: Damageable
      damageContainer: OrganicPart # Shitmed
    - type: BodyPart
    - type: ContainerContainer
      containers:
        bodypart: !type:Container
          ents: []

- type: entity
  id: TorsoDigikith
  name: "digikith torso"
  parent: PartDigikith
  components:
    - type: Sprite
      state: "torso"
    - type: Icon
      state: "torso"
    - type: BodyPart
      partType: Torso

- type: entity
  id: HeadDigikith
  name: "digikith head"
  parent: PartDigikith
  components:
    - type: Sprite
      state: "head"
    - type: Icon
      state: "head"
    - type: BodyPart
      partType: Head
    - type: Input
      context: "ghost"
    - type: MovementSpeedModifier
      baseWalkSpeed: 0
      baseSprintSpeed: 0
    - type: InputMover
    - type: GhostOnMove

- type: entity
  id: LeftArmDigikith
  name: "left digikith arm"
  parent: PartDigikith
  components:
    - type: Sprite
      state: "l_arm"
    - type: Icon
      state: "l_arm"
    - type: BodyPart
      partType: Arm
      symmetry: Left

- type: entity
  id: RightArmDigikith
  name: "right digikith arm"
  parent: PartDigikith
  components:
    - type: Sprite
      state: "r_arm"
    - type: Icon
      state: "r_arm"
    - type: BodyPart
      partType: Arm
      symmetry: Right

